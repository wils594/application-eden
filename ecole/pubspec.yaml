name: ecole_eden
description: "Application mobile de l'École Eden."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  http: ^1.6.0
  pdfrx: ^2.6.5
  file_selector: ^1.1.0
  flutter_file_dialog: ^3.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/